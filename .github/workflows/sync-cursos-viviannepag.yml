name: Sincronizar saber → viviannepag

# A cada aula nova (quando as sínteses mudam no main), o bot leva o saber para
# o viviannepag em DUAS camadas. Zero cliques:
#
#  1) conceitos — edita lib/infografico/cursos.ts IN-PLACE (só troca as listas
#     de `conceitos`; preserva conceitosDosCursos, getCurso, imports, tudo);
#  2) SABER COMPLETO — reconstrói `saber/` no viviannepag com as sínteses
#     integrais, transcrições, resumos, objetivos, produto e o saber.json,
#     organizado por curso/cadeira, com INDICE.md (scripts/exportar-saber-
#     completo.mjs). As sessões do viviannepag leem tudo da fonte, sem extratos.
#
# Requisito ÚNICO (uma vez): o secret VIVIANNEPAG_TOKEN — token com Contents:
# Read and write no vivnasc/viviannepag. Depois disto nunca mais mexes.

on:
  push:
    branches: [main]
    paths:
      - 'cursos/**/sinteses/**'
      - 'disciplina-partilhada/**/sinteses/**'
      - 'scripts/patch-cursos-viviannepag.mjs'
      - 'scripts/exportar-saber-completo.mjs'
      - 'scripts/gerar-conteudo.mjs'
  workflow_dispatch:

concurrency:
  group: sync-viviannepag
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da Syntia
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerar o saber.json
        run: node scripts/gerar-conteudo.mjs

      - name: Editar o cursos.ts do viviannepag (in-place) e enviar
        env:
          TOKEN: ${{ secrets.VIVIANNEPAG_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Sem VIVIANNEPAG_TOKEN — salto o push (cria o secret em syntia → Settings → Secrets → Actions)."
            exit 0
          fi
          echo "Token presente (${#TOKEN} caracteres). A clonar o viviannepag…"
          git clone "https://x-access-token:${TOKEN}@github.com/vivnasc/viviannepag.git" vp
          DEST="vp/lib/infografico/cursos.ts"
          if [ ! -f "$DEST" ]; then
            echo "!! $DEST não existe no viviannepag — aborto sem tocar em nada."
            exit 1
          fi
          # Edita as listas de conceitos e cria cursos novos, in-place (preserva o resto).
          node scripts/patch-cursos-viviannepag.mjs "$DEST" public/saber.json > /tmp/cursos.ts
          # Trava de segurança: recuso escrever se algo essencial se partir.
          #  1) conceitosDosCursos tem de continuar lá (15+ motores importam-na);
          #  2) chavetas e parênteses retos têm de ficar equilibrados.
          node -e '
            const t = require("fs").readFileSync("/tmp/cursos.ts","utf8");
            const bal = (a,b) => (t.split(a).length === t.split(b).length);
            if (!/conceitosDosCursos/.test(t)) { console.error("sem conceitosDosCursos"); process.exit(1); }
            if (!bal("{","}") || !bal("[","]")) { console.error("estrutura desequilibrada"); process.exit(1); }
            if (!/export const CURSOS/.test(t)) { console.error("sem CURSOS"); process.exit(1); }
            console.log("verificacao de seguranca: OK");
          ' || { echo "!! resultado inseguro — recuso escrever (protejo o build)."; exit 1; }
          cp /tmp/cursos.ts "$DEST"
          # Camada 2: o saber COMPLETO (sínteses integrais, transcrições,
          # resumos, objetivos, produto, saber.json) → vp/saber/, com INDICE.md
          # e a secção no CLAUDE.md do viviannepag (idempotente).
          node scripts/exportar-saber-completo.mjs vp
          cd vp
          git add lib/infografico/cursos.ts saber/ CLAUDE.md
          if git diff --staged --quiet; then
            echo "Saber já igual — nada a fazer."
            exit 0
          fi
          # Commita com a identidade da Vivianne (não um bot) para o Vercel
          # autorizar o deploy de produção (deploys de autores externos ficam
          # "Blocked"). O push continua a ser feito com o VIVIANNEPAG_TOKEN.
          git config user.name "vivnasc"
          git config user.email "61882995+vivnasc@users.noreply.github.com"
          git commit -m "Saber dos cursos atualizado a partir da Syntia (automático)"
          for n in 1 2 3 4; do
            git push origin HEAD:main && { echo "push ok"; exit 0; }
            echo "push falhou ($n), rebase e tento de novo…"
            git pull --rebase -X ours origin main || true
            sleep $((RANDOM % 4 + 2))
          done
          echo "push falhou após várias tentativas"; exit 1
